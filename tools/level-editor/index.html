<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>沙盒关卡编辑器 · 奥拉星</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<!-- Nothing is loaded from other sites: scripts, styles and data come from this folder (or the game beside it); pictures are data: URLs. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header class="top">
  <div class="brand" title="奥拉星 revival · 沙盒关卡编辑器">
    <span class="logo" aria-hidden="true"></span>
    <span class="brand-text"><b>沙盒关卡编辑器</b><small>奥拉星 · 关卡包（第 2 版格式）</small></span>
  </div>
  <div class="pack-fields">
    <label>包名 <input id="packName" type="text" maxlength="30" data-key="pack-name" placeholder="我的关卡包"></label>
    <label>作者 <input id="packAuthor" type="text" maxlength="30" data-key="pack-author" placeholder="可不填"></label>
  </div>
  <div class="actions">
    <button type="button" id="btnNew">新建</button>
    <button type="button" id="btnImport">导入…</button>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
    <button type="button" id="btnCheck">检查</button>
    <button type="button" id="btnExport" class="primary">导出</button>
    <span class="sep"></span>
    <button type="button" id="btnUndo" title="撤销（Ctrl+Z）">撤销</button>
    <button type="button" id="btnRedo" title="重做（Ctrl+Y）">重做</button>
  </div>
  <div class="save-state" id="saveState" aria-live="polite"></div>
</header>

<main class="layout">
  <aside class="left" id="left">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="levels">关卡与房间</button>
      <button type="button" role="tab" data-tab="images">图片 <span id="imageCount"></span></button>
    </nav>
    <div class="pane" id="levelsPane"></div>
    <div class="pane" id="imagesPane" hidden></div>
  </aside>

  <section class="center">
    <div class="toolbar" id="toolbar"></div>
    <div class="stage-wrap" id="stageWrap">
      <canvas id="stage" width="960" height="560"></canvas>
      <div class="stage-empty" id="stageEmpty" hidden></div>
    </div>
    <div class="statusbar">
      <span id="coords">—</span>
      <span id="roomInfo"></span>
      <span id="toolHint" class="hint"></span>
    </div>
  </section>

  <aside class="right" id="inspector"></aside>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="fileImages" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
<datalist id="raceList"></datalist>

<dialog id="dialog">
  <h3 id="dlgTitle"></h3>
  <div id="dlgBody"></div>
  <div class="dlg-buttons" id="dlgButtons"></div>
</dialog>

<script src="pack.js"></script>
<script src="editor.js"></script>
</body>
</html>
