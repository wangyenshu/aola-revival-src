<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>奥拉星</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /*
   * The page around the game, after the official site of 2012-13
   * (aola.100bt.com, where the game sat in the middle of the home page,
   * #game_flash 960 x 560): 百田's games along the top, the game in a framed
   * block, and the 奥拉星亚比 panel under it.
   * The pictures are the site's own (Wayback captures of January 2013, in
   * game/); the service worker answers their original addresses, so they
   * are put on once it runs (boot.js adds the class "site").
   */
  html, body { margin: 0; }
  body { background: #eaf6fd linear-gradient(#c9e8fb, #eaf6fd 260px) no-repeat; color: #335; font: 12px/1.5 SimSun, "宋体", "Microsoft YaHei", sans-serif; }
  #wrap { width: 964px; margin: 0 auto; padding: 6px 0 24px; }
  #games { height: 70px; margin: 0 auto 10px; width: 845px; }
  html.site #games { background: url(//www.100bt.com/resource/css/common/gamecommon/gamecommonsp.png) 0 0 no-repeat; }
  #frame { position: relative; width: 960px; border: 1px solid #b9dcf3; background: #fff; padding: 1px; border-radius: 6px; box-shadow: 0 2px 8px rgba(43, 143, 224, .25); }
  #stage { position: relative; width: 960px; min-height: 560px; background: #000; border-radius: 4px; overflow: hidden; }
  #pets { position: relative; width: 964px; height: 191px; margin-top: 12px; background: #d9f2fd; border-radius: 8px; }
  html.site #pets { background: url(//aola.100bt.com/resource/image/slidebg.jpg) 0 0 no-repeat; }
  #news { position: absolute; left: 258px; top: 40px; width: 690px; height: 136px; overflow: auto; padding: 0 6px; }
  #news h2 { margin: 0 0 4px; font-size: 14px; color: #1a5fa8; }
  #news ul { margin: 0; padding-left: 18px; }
  #news li { margin: 1px 0; }
  #status { margin-top: 6px; color: #2b6aa3; }
  #foot { margin-top: 10px; text-align: center; color: #7a93ad; }
  #foot b { color: #e8641b; }
  /* ?bare=1 (the automated walk-throughs): the game alone at (20, 16), as they click by page position. */
  html.bare body { background: #0d1a33; color: #cfe0ff; }
  html.bare #wrap { width: 960px; margin: 16px auto; padding: 0; }
  html.bare #games, html.bare #foot, html.bare #news h2, html.bare #news ul { display: none; }
  html.bare #frame { border: 0; padding: 0; border-radius: 0; box-shadow: none; }
  html.bare #stage { border-radius: 0; }
  html.bare #pets { background: none; height: auto; margin-top: 8px; }
  html.bare #news { position: static; width: auto; height: auto; padding: 0; }
  html.bare #status { color: #8fa8d6; margin: 0; }
</style>
<script>if (/[?&]bare=1(&|$)/.test(location.search)) document.documentElement.classList.add("bare");</script>
</head>
<body>
<div id="wrap">
  <div id="games" title="百田的游戏"></div>
  <div id="frame"><div id="stage"></div></div>
  <div id="pets">
    <div id="news">
      <h2>奥拉星 · 2013年1月版的复刻</h2>
      <ul>
        <li>点「开始」进入游戏；存档留在这个浏览器里。</li>
        <li>右上的「工具箱」可以增加晶币、星币、晶豆和亚比经验，领取亚比，成为蓝宝石，传送到任何地图，导出和导入存档。</li>
        <li>「回家」先到家园：植树盆里可以种树，「我的家」是小屋。</li>
        <li>任务面板里有2010–12年的星际故事任务。</li>
      </ul>
      <div id="status">…</div>
    </div>
  </div>
  <div id="foot">适龄提示：本产品适合 <b>7–14</b> 岁儿童使用 · 健康游戏，合理安排时间</div>
</div>
<script src="config.js"></script>
<script src="emulator.js"></script>
<script src="theatre.js"></script>
<script src="saves.js"></script>
<script src="boot.js"></script>
</body>
</html>
