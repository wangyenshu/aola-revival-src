# Build the rebuilt SWF modules and the static site from this repository
# alone (the game files are in game/; only build tools are downloaded) and
# publish it with GitHub Pages. Repository settings → Pages → Source:
# "GitHub Actions".
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ hashFiles('rebuild/build/setup-toolchain.sh') }}
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm test
      - name: Build the rebuilt SWF modules
        run: npm run build:swf
      - name: Build the static site
        run: npm run build -- --copy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
