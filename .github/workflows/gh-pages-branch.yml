# Build the site as pages.yml does and put it on the branch gh-pages, for
# "Deploy from a branch" (Repository settings → Pages → Source: "Deploy from a
# branch", branch gh-pages, folder / (root)). Run by hand only: Actions → this
# workflow → "Run workflow".
#
# The branch gets one commit holding exactly the files of dist/: whatever was
# on it before is replaced (it is force-pushed), so it never grows with old
# builds. dist/ is about 1.4 GB, so each run uploads that much.
#
# The game files come from game/ when the repository has it. When it does not,
# tools/fetch_game.py downloads them first (百田's CDN and the Wayback Machine,
# about 1.4 GB, an hour or more) and they are kept in the Actions cache for the
# next runs (the same cache as pages.yml's); a file that cannot be had as listed
# gives a warning, not a failure.
name: Build and publish to gh-pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-branch
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - name: Make sure the branch gh-pages exists
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages > /dev/null; then
            echo "gh-pages exists: its files will be replaced"
          else
            echo "gh-pages does not exist: creating it"
            empty="$(mktemp -d)"
            git -C "$empty" init -q -b gh-pages
            git -C "$empty" -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q --allow-empty -m "Create gh-pages"
            git -C "$empty" push -q "$REMOTE" gh-pages
          fi

      - name: Is game/ in the repository?
        id: game
        run: |
          if [ -d game ]; then
            echo "game/ is in the repository: nothing is downloaded"
            echo "fetch=false" >> "$GITHUB_OUTPUT"
          else
            echo "no game/: the game files are downloaded"
            echo "fetch=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the downloaded game files
        id: game-cache
        if: steps.game.outputs.fetch == 'true'
        uses: actions/cache/restore@v4
        with:
          path: game
          key: game-${{ hashFiles('tools/data/game-sources.jsonl') }}
          restore-keys: game-
      - name: Download the game files
        id: fetch
        if: steps.game.outputs.fetch == 'true'
        timeout-minutes: 300
        run: |
          # FFmpeg makes the theatre's films from the downloaded ones.
          command -v ffmpeg > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          python3 tools/fetch_game.py || echo "::warning::Some game files could not be downloaded as listed: see the summary above (work/fetch-game-report.json)."
      - name: Keep the downloaded game files for the next runs
        if: steps.fetch.outcome == 'success' && steps.game-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: game
          key: game-${{ hashFiles('tools/data/game-sources.jsonl') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ hashFiles('rebuild/build/setup-toolchain.sh') }}
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm test
      - name: Build the rebuilt SWF modules
        run: npm run build:swf
      - name: Build the static site
        run: npm run build -- --copy

      - name: Push dist/ to gh-pages
        working-directory: dist
        run: |
          # No Jekyll on GitHub Pages: the files are served as they are.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 1048576000
          git add -A
          git commit -q -m "Site built from ${GITHUB_SHA}"
          git push --force "$REMOTE" gh-pages
          echo "gh-pages now holds $(git ls-files | wc -l) files from ${GITHUB_SHA}"
