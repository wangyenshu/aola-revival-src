# The shared server on Cloudflare (src/cloudflare/worker.ts): copy to wrangler.toml at the
# repository's root, build the site (npm run build:swf && npm run build), then `npx wrangler deploy`.
# docs/MULTIPLAYER.md has the whole of it. The game files are private: keep the deployment to
# yourself and the friends you play with (a Cloudflare Access policy in front of it does that).
name = "aola-revival"
main = "server/src/cloudflare/worker.ts"
compatibility_date = "2025-01-01"

# The built site; the Worker answers /__socket/ and /__api/ itself.
[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/__socket/*", "/__api/*"]

# The game: one Durable Object, its saves in its own (SQLite-backed) storage.
[[durable_objects.bindings]]
name = "GAME"
class_name = "AolaGame"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AolaGame"]

[vars]
# "1": no new names (only the 奥拉 already signed up may log in).
AOLA_CLOSED = "0"
AOLA_DATE = "2012-08-15"
AOLA_MAX_PLAYERS = "200"
# "0": the 工具箱, mods' gifts of 亚比 and 导入存档 closed to the players (open by default).
AOLA_TOOLBOX = "1"
# "1": a save copied in without a password takes the password of its first login.
AOLA_ADOPT = "0"
